<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print &amp; Download</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      line-height: 1.6;
    }
    .actions {
      margin-top: 20px;
    }
    button, .download-btn {
      display: inline-block;
      padding: 10px 16px;
      margin-right: 10px;
      background-color: #0366d6;
      color: #ffffff;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover, .download-btn:hover {
      background-color: #024ea4;
    }
    /* Hide buttons when printing */
    @media print {
      .actions {
        display: none;
      }
    }
  </style>
</head>
<body>

  <h1>Project Summary</h1>
  <p>This is the content that will be displayed on screen and printed when you click the button below.</p>

  <div class="actions">
    <!-- Triggers the browser print dialog -->
    <button onclick="window.print()">Print This Page</button>

    <!-- Download link for a file stored in your repository -->
    <a href="sample.pdf" download="sample.pdf" class="download-btn">Download File</a>
  </div>

</body>
</html>
